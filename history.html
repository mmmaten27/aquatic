<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico?v=2" type="image/x-icon">
    <title>偵測歷史紀錄 - 智慧物聯實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(160deg, #cffafe 0%, #e0f2fe 55%, #dcfce7 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .ocean { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; overflow:hidden; }
        .fish-shadow { position:absolute; fill:rgba(14,116,144,0.10); animation:swim-forward linear infinite; }
        .leaf-float  { position:absolute; animation:float-around ease-in-out infinite; transform-origin:center; }
        @keyframes swim-forward {
            0%   { transform: translateX(110vw) translateY(0px); }
            50%  { transform: translateX(45vw)  translateY(14px); }
            100% { transform: translateX(-20vw) translateY(0px); }
        }
        @keyframes float-around {
            0%,100% { transform: translateY(0px)  rotate(0deg); }
            50%     { transform: translateY(-32px) rotate(-5deg); }
        }
        .glass-card {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.55);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(14,116,144,0.08);
        }
        .glass-header {
            background: rgba(255,255,255,0.90);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
        .fade-in { animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
        .btn-page {
            min-width:2rem; height:2rem; border-radius:0.5rem;
            display:inline-flex; align-items:center; justify-content:center;
            font-size:0.8rem; transition:all 0.15s; cursor:pointer;
        }
        .btn-page:hover:not(:disabled) { background:rgba(8,145,178,0.15); }
        .btn-page.active { background:#0891b2; color:#fff; }
        .btn-page:disabled { opacity:0.35; cursor:not-allowed; }
        tr.still-inside td:first-child { border-left:3px solid #06b6d4; }
    </style>
</head>
<body class="min-h-screen">

<!-- Background -->
<div class="ocean" aria-hidden="true">
    <svg class="fish-shadow" style="width:90px;top:18%;animation-duration:28s;animation-delay:-5s" viewBox="0 0 100 50"><ellipse cx="55" cy="25" rx="35" ry="14"/><polygon points="10,25 25,10 25,40"/></svg>
    <svg class="fish-shadow" style="width:55px;top:62%;animation-duration:22s;animation-delay:-13s" viewBox="0 0 100 50"><ellipse cx="55" cy="25" rx="35" ry="14"/><polygon points="10,25 25,10 25,40"/></svg>
    <svg class="leaf-float" style="width:36px;top:22%;left:8%;animation-duration:9s;animation-delay:-3s;fill:rgba(22,163,74,0.18)" viewBox="0 0 60 80"><ellipse cx="30" cy="55" rx="22" ry="30" transform="rotate(-20 30 55)"/></svg>
    <svg class="leaf-float" style="width:28px;top:70%;left:88%;animation-duration:12s;animation-delay:-7s;fill:rgba(22,163,74,0.14)" viewBox="0 0 60 80"><ellipse cx="30" cy="55" rx="22" ry="30" transform="rotate(15 30 55)"/></svg>
</div>

<!-- Header -->
<header class="glass-header sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="/" class="text-slate-500 hover:text-cyan-600 transition-colors text-sm flex items-center gap-1">
                <i class="fas fa-arrow-left"></i> 返回
            </a>
            <div class="w-px h-5 bg-slate-200"></div>
            <span class="text-slate-400 text-sm">🔬 智慧物聯實驗室</span>
            <div class="w-px h-5 bg-slate-200"></div>
            <h1 class="text-slate-700 font-semibold text-base flex items-center gap-2">
                <i class="fas fa-history text-cyan-500"></i> 偵測歷史紀錄
            </h1>
        </div>
        <div class="flex items-center gap-2 text-sm bg-cyan-50 border border-cyan-100 rounded-full px-3 py-1">
            <span class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></span>
            <span class="text-cyan-700 font-medium" id="room-count">— 人在室內</span>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6 space-y-4">

    <!-- Filter bar -->
    <div class="glass-card p-4 fade-in">
        <div class="flex flex-wrap items-end gap-3">
            <div class="flex-1 min-w-[160px]">
                <label class="block text-xs text-slate-500 mb-1">搜尋姓名</label>
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input id="filter-search" type="text" placeholder="成員姓名..."
                        class="w-full pl-8 pr-3 py-2 text-sm rounded-xl bg-white/70 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-100 text-slate-700">
                </div>
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">開始日期</label>
                <input id="filter-from" type="date"
                    class="px-3 py-2 text-sm rounded-xl bg-white/70 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-100 text-slate-700">
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">結束日期</label>
                <input id="filter-to" type="date"
                    class="px-3 py-2 text-sm rounded-xl bg-white/70 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-100 text-slate-700">
            </div>
            <button onclick="loadHistory(1)"
                class="px-4 py-2 bg-cyan-600 hover:bg-cyan-700 text-white text-sm font-medium rounded-xl transition-colors flex items-center gap-2">
                <i class="fas fa-filter"></i> 篩選
            </button>
            <button onclick="clearFilters()"
                class="px-4 py-2 bg-white/70 hover:bg-white border border-slate-200 text-slate-600 text-sm rounded-xl transition-colors">
                清除
            </button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="glass-card overflow-hidden fade-in">
        <div class="flex border-b border-slate-100">
            <button id="tab-entry" onclick="switchTab('entry')"
                class="flex-1 py-3 text-sm font-semibold flex items-center justify-center gap-2 transition-colors border-b-2 border-cyan-500 text-cyan-700">
                <i class="fas fa-door-open"></i> 人員進出紀錄
                <span id="tab-entry-count" class="text-xs bg-cyan-100 text-cyan-700 px-2 py-0.5 rounded-full"></span>
            </button>
            <button id="tab-unknown" onclick="switchTab('unknown')"
                class="flex-1 py-3 text-sm font-semibold flex items-center justify-center gap-2 transition-colors border-b-2 border-transparent text-slate-400 hover:text-slate-600">
                <i class="fas fa-user-secret"></i> 未知人員警報
                <span id="tab-unknown-count" class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full"></span>
            </button>
        </div>

        <!-- Tab: Entry/Exit -->
        <div id="panel-entry">
            <div class="flex items-center justify-between px-5 py-2.5 bg-slate-50/50 border-b border-slate-100">
                <span id="total-label" class="text-xs text-slate-400"></span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-slate-50/60 text-slate-500 text-xs tracking-wide">
                            <th class="px-4 py-3 text-left font-medium">成員</th>
                            <th class="px-4 py-3 text-left font-medium">進入時間</th>
                            <th class="px-4 py-3 text-left font-medium">離開時間</th>
                            <th class="px-4 py-3 text-center font-medium">停留時間</th>
                            <th class="px-4 py-3 text-center font-medium">狀態</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="5" class="text-center py-12 text-slate-400">
                            <i class="fas fa-spinner fa-spin mr-2"></i>載入中…
                        </td></tr>
                    </tbody>
                </table>
            </div>
            <div class="flex items-center justify-between px-5 py-3 border-t border-slate-100/80">
                <span id="page-info" class="text-xs text-slate-400"></span>
                <div id="page-buttons" class="flex items-center gap-1"></div>
            </div>
        </div>

        <!-- Tab: Unknown alerts -->
        <div id="panel-unknown" class="hidden">
            <div class="p-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3" id="unknown-grid">
                <div class="col-span-full text-center py-12 text-slate-400">
                    <i class="fas fa-spinner fa-spin mr-2"></i>載入中…
                </div>
            </div>
        </div>
    </div>

</main>

<script>
    let currentPage = 1;
    let totalPages  = 1;
    let activeTab   = 'entry';

    // ── helpers ────────────────────────────────────────────────────────────
    function fmtDuration(min) {
        if (min == null) return '—';
        if (min < 1)  return '< 1 分鐘';
        if (min < 60) return `${min} 分鐘`;
        const h = Math.floor(min / 60), m = min % 60;
        return m ? `${h} 小時 ${m} 分` : `${h} 小時`;
    }

    function initials(name) {
        if (!name) return '?';
        const p = name.trim().split(/\s+/);
        return (p.length >= 2 ? p[0][0]+p[p.length-1][0] : name.slice(0,2)).toUpperCase();
    }

    const AVATAR_COLORS = [
        'bg-cyan-500','bg-blue-500','bg-violet-500',
        'bg-rose-500','bg-amber-500','bg-emerald-500'
    ];
    function avatarColor(name) {
        let h = 0;
        for (const c of (name||'?')) h = (h*31 + c.charCodeAt(0)) & 0xffff;
        return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }

    // ── tab switching ───────────────────────────────────────────────────────
    function switchTab(tab) {
        activeTab = tab;
        ['entry','unknown'].forEach(t => {
            const btn   = document.getElementById(`tab-${t}`);
            const panel = document.getElementById(`panel-${t}`);
            if (t === tab) {
                btn.classList.replace('border-transparent','border-cyan-500');
                btn.classList.replace('text-slate-400','text-cyan-700');
                panel.classList.remove('hidden');
            } else {
                btn.classList.replace('border-cyan-500','border-transparent');
                btn.classList.replace('text-cyan-700','text-slate-400');
                panel.classList.add('hidden');
            }
        });
        if (tab === 'unknown') loadUnknownAlerts();
    }

    // ── entry/exit history ──────────────────────────────────────────────────
    async function loadHistory(page = 1) {
        currentPage = page;
        const search   = document.getElementById('filter-search').value.trim();
        const dateFrom = document.getElementById('filter-from').value;
        const dateTo   = document.getElementById('filter-to').value;

        const params = new URLSearchParams({ page });
        if (search)   params.append('search',    search);
        if (dateFrom) params.append('date_from', dateFrom);
        if (dateTo)   params.append('date_to',   dateTo);

        const tbody = document.getElementById('history-tbody');
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-slate-400">
            <i class="fas fa-spinner fa-spin mr-2"></i>載入中…</td></tr>`;

        try {
            const res  = await fetch(`/api/room/history?${params}`);
            const data = await res.json();
            if (data.error) throw new Error(data.error);

            totalPages = data.total_pages;
            document.getElementById('total-label').textContent =
                data.total > 0 ? `共 ${data.total.toLocaleString()} 筆紀錄` : '';
            document.getElementById('tab-entry-count').textContent =
                data.total > 0 ? data.total : '';

            renderTable(data.records);
            renderPagination(data.page, data.total_pages, data.total, data.per_page);
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-red-400">
                <i class="fas fa-exclamation-circle mr-2"></i>${e.message}</td></tr>`;
        }
    }

    function renderTable(records) {
        const tbody = document.getElementById('history-tbody');
        if (!records.length) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-slate-400">
                <i class="fas fa-inbox mr-2 text-lg"></i><br>查無資料</td></tr>`;
            return;
        }
        tbody.innerHTML = records.map(r => {
            const inside  = !r.exited_at;
            const folder  = r.face_folder || '';
            const name    = r.person_name || '—';

            const avatarHtml = folder
                ? `<img src="/api/face-photo/${folder}" class="w-9 h-9 rounded-full object-cover flex-shrink-0"
                       onerror="this.replaceWith(mkAvatar('${name}'))">`
                : `<div class="w-9 h-9 rounded-full ${avatarColor(name)} flex items-center justify-center text-white text-xs font-bold flex-shrink-0">${initials(name)}</div>`;

            const statusBadge = inside
                ? `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-700">
                       <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>在室內
                   </span>`
                : `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-500">
                       <span class="w-1.5 h-1.5 bg-slate-400 rounded-full"></span>已離開
                   </span>`;

            const exitCell = r.exited_at
                ? `<span class="text-slate-700">${r.exited_at}</span>`
                : `<span class="text-slate-300 italic">—</span>`;

            return `<tr class="border-t border-slate-100 hover:bg-cyan-50/30 transition-colors">
                <td class="px-4 py-3">
                    <div class="flex items-center gap-2.5">
                        ${avatarHtml}
                        <span class="font-semibold text-slate-800">${name}</span>
                    </div>
                </td>
                <td class="px-4 py-3 text-slate-600 whitespace-nowrap text-sm">${r.entered_at}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm">${exitCell}</td>
                <td class="px-4 py-3 text-center text-slate-600 font-medium text-sm">${fmtDuration(r.duration_min)}</td>
                <td class="px-4 py-3 text-center">${statusBadge}</td>
            </tr>`;
        }).join('');
    }

    function mkAvatar(name) {
        const d = document.createElement('div');
        d.className = `w-9 h-9 rounded-full ${avatarColor(name)} flex items-center justify-center text-white text-xs font-bold flex-shrink-0`;
        d.textContent = initials(name);
        return d;
    }

    function renderPagination(page, total_pages, total, per_page) {
        const start = Math.min((page-1)*per_page+1, total);
        const end   = Math.min(page*per_page, total);
        document.getElementById('page-info').textContent =
            total > 0 ? `顯示 ${start}–${end}，共 ${total.toLocaleString()} 筆` : '';

        const btns = document.getElementById('page-buttons');
        btns.innerHTML = '';
        const addBtn = (html, pg, disabled=false, active=false) => {
            const b = document.createElement('button');
            b.className = `btn-page text-slate-600 ${active?'active':''}`;
            b.innerHTML = html; b.disabled = disabled;
            if (!disabled) b.onclick = () => loadHistory(pg);
            btns.appendChild(b);
        };
        addBtn('<i class="fas fa-chevron-left text-xs"></i>', page-1, page<=1);
        let pages = new Set([1, total_pages]);
        for (let p=Math.max(1,page-2); p<=Math.min(total_pages,page+2); p++) pages.add(p);
        let sorted=[...pages].sort((a,b)=>a-b), prev=0;
        sorted.forEach(p => {
            if (p-prev>1) { const s=document.createElement('span'); s.className='text-slate-400 text-xs px-1'; s.textContent='…'; btns.appendChild(s); }
            addBtn(p, p, false, p===page); prev=p;
        });
        addBtn('<i class="fas fa-chevron-right text-xs"></i>', page+1, page>=total_pages);
    }

    // ── unknown alerts ──────────────────────────────────────────────────────
    async function loadUnknownAlerts() {
        const grid = document.getElementById('unknown-grid');
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i>載入中…</div>`;
        try {
            const res  = await fetch('/api/unknown-alerts');
            const data = await res.json();
            const alerts = data.alerts || [];
            document.getElementById('tab-unknown-count').textContent = alerts.length || '';
            if (!alerts.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fas fa-shield-alt text-3xl mb-2 block opacity-30"></i>尚無未知人員紀錄</div>`;
                return;
            }
            grid.innerHTML = alerts.map(a => `
                <div class="rounded-2xl overflow-hidden bg-white/70 border border-slate-100 shadow-sm hover:shadow-md transition group">
                    <div class="aspect-video bg-slate-100 overflow-hidden">
                        <img src="${a.url}?t=${Date.now()}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                             onerror="this.parentElement.innerHTML='<div class=\'flex items-center justify-center h-full text-slate-300 text-3xl\'>📷</div>'">
                    </div>
                    <div class="px-3 py-2">
                        <div class="flex items-center gap-1.5 mb-0.5">
                            <span class="w-2 h-2 bg-amber-400 rounded-full flex-shrink-0"></span>
                            <span class="text-xs font-semibold text-amber-700">未知人員</span>
                        </div>
                        <div class="text-xs text-slate-500">${a.time}</div>
                    </div>
                </div>`).join('');
        } catch(e) {
            grid.innerHTML = `<div class="col-span-full text-center py-8 text-red-400">載入失敗</div>`;
        }
    }

    // ── room status ─────────────────────────────────────────────────────────
    async function loadRoomStatus() {
        try {
            const d = await (await fetch('/api/room/status')).json();
            document.getElementById('room-count').textContent = `${d.count} 人在室內`;
        } catch(_) {}
    }

    function clearFilters() {
        document.getElementById('filter-search').value = '';
        document.getElementById('filter-from').value   = '';
        document.getElementById('filter-to').value     = '';
        loadHistory(1);
    }

    document.getElementById('filter-search').addEventListener('keydown', e => {
        if (e.key === 'Enter') loadHistory(1);
    });

    loadHistory(1);
    loadRoomStatus();
    setInterval(loadRoomStatus, 15000);
</script>
</body>
</html>
