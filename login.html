<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>登入 - AQUATIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(160deg, #cffafe 0%, #e0f2fe 55%, #dcfce7 100%);
            overflow: hidden;
        }

        .ocean {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .fish-shadow {
            position: absolute;
            fill: rgba(14, 116, 144, 0.13);
            animation: swim-forward linear infinite;
        }

        .leaf-float {
            position: absolute;
            animation: float-around ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes swim-forward {
            0% {
                transform: translateX(110vw) translateY(0px);
            }

            25% {
                transform: translateX(75vw) translateY(-18px);
            }

            50% {
                transform: translateX(45vw) translateY(12px);
            }

            75% {
                transform: translateX(15vw) translateY(-10px);
            }

            100% {
                transform: translateX(-20vw) translateY(0px);
            }
        }

        @keyframes float-around {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            25% {
                transform: translateY(-22px) rotate(8deg);
            }

            50% {
                transform: translateY(-38px) rotate(-4deg);
            }

            75% {
                transform: translateY(-18px) rotate(10deg);
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 2rem;
            box-shadow: 0 16px 48px rgba(14, 116, 144, 0.12);
        }

        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            font-family: 'Noto Sans TC', sans-serif;
            background: rgba(255, 255, 255, 0.9);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            box-sizing: border-box;
        }

        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .btn-primary:hover {
            opacity: 0.92;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 0.6rem 1rem;
            border-radius: 0.6rem;
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>

<body>

    <div class="ocean">
        <svg class="fish-shadow" style="top:8%;width:170px;animation-duration:48s;animation-delay:0s;"
            viewBox="0 0 550 290">
            <path
                d="M42,145 C68,100 130,74 175,72 C202,71 208,47 232,32 C250,18 270,16 286,28 C302,40 306,62 330,72 C358,82 378,108 398,122 L510,40 L458,145 L510,250 L398,168 C372,182 345,204 308,220 C268,238 215,248 175,242 C136,236 80,208 42,145 Z" />
        </svg>
        <svg class="fish-shadow" style="top:42%;width:230px;animation-duration:62s;animation-delay:-22s;"
            viewBox="0 0 550 290">
            <path
                d="M42,145 C68,100 130,74 175,72 C202,71 208,47 232,32 C250,18 270,16 286,28 C302,40 306,62 330,72 C358,82 378,108 398,122 L510,40 L458,145 L510,250 L398,168 C372,182 345,204 308,220 C268,238 215,248 175,242 C136,236 80,208 42,145 Z" />
        </svg>
        <svg class="fish-shadow" style="top:76%;width:140px;animation-duration:40s;animation-delay:-12s;"
            viewBox="0 0 550 290">
            <path
                d="M42,145 C68,100 130,74 175,72 C202,71 208,47 232,32 C250,18 270,16 286,28 C302,40 306,62 330,72 C358,82 378,108 398,122 L510,40 L458,145 L510,250 L398,168 C372,182 345,204 308,220 C268,238 215,248 175,242 C136,236 80,208 42,145 Z" />
        </svg>
        <svg class="leaf-float" style="top:5%;left:8%;width:42px;animation-duration:11s;fill:rgba(16,185,129,0.22);"
            viewBox="0 0 300 500">
            <path d="M150,490 C90,450 30,370 25,270 C20,170 75,50 150,15 C225,50 280,170 275,270 C270,370 210,450 150,490 Z" />
        </svg>
        <svg class="leaf-float"
            style="top:18%;left:78%;width:56px;animation-duration:14s;animation-delay:-4s;fill:rgba(6,182,212,0.18);"
            viewBox="0 0 512 512">
            <path
                d="M256 20 C 356 20, 490 140, 490 256 C 490 372, 356 492, 256 492 C 156 492, 22 372, 22 256 C 22 140, 156 20, 256 20 Z" />
        </svg>
        <svg class="leaf-float"
            style="top:32%;left:15%;width:36px;animation-duration:13s;animation-delay:-7s;fill:rgba(52,211,153,0.20);"
            viewBox="0 0 300 500">
            <path d="M150,490 C90,450 30,370 25,270 C20,170 75,50 150,15 C225,50 280,170 275,270 C270,370 210,450 150,490 Z" />
        </svg>
        <svg class="leaf-float"
            style="top:52%;left:88%;width:48px;animation-duration:15s;animation-delay:-2s;fill:rgba(20,184,166,0.18);"
            viewBox="0 0 512 512">
            <path
                d="M256 20 C 356 20, 490 140, 490 256 C 490 372, 356 492, 256 492 C 156 492, 22 372, 22 256 C 22 140, 156 20, 256 20 Z" />
        </svg>
        <svg class="leaf-float"
            style="top:65%;left:12%;width:50px;animation-duration:12s;animation-delay:-9s;fill:rgba(16,185,129,0.20);"
            viewBox="0 0 300 500">
            <path d="M150,490 C90,450 30,370 25,270 C20,170 75,50 150,15 C225,50 280,170 275,270 C270,370 210,450 150,490 Z" />
        </svg>
        <svg class="leaf-float"
            style="top:75%;left:60%;width:38px;animation-duration:16s;animation-delay:-5s;fill:rgba(6,182,212,0.18);"
            viewBox="0 0 512 512">
            <path
                d="M256 20 C 356 20, 490 140, 490 256 C 490 372, 356 492, 256 492 C 156 492, 22 372, 22 256 C 22 140, 156 20, 256 20 Z" />
        </svg>
        <svg class="leaf-float"
            style="top:88%;left:30%;width:44px;animation-duration:11s;animation-delay:-11s;fill:rgba(52,211,153,0.18);"
            viewBox="0 0 300 500">
            <path d="M150,490 C90,450 30,370 25,270 C20,170 75,50 150,15 C225,50 280,170 275,270 C270,370 210,450 150,490 Z" />
        </svg>
        <svg class="leaf-float"
            style="top:40%;left:45%;width:40px;animation-duration:14s;animation-delay:-6s;fill:rgba(16,185,129,0.20);"
            viewBox="0 0 300 500">
            <path d="M150,490 C90,450 30,370 25,270 C20,170 75,50 150,15 C225,50 280,170 275,270 C270,370 210,450 150,490 Z" />
        </svg>
    </div>

    <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md p-8 shadow-2xl">

            <!-- Logo -->
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg mx-auto mb-4">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M2 12c5-5 15-5 20 0-5 5-15 5-20 0z" />
                        <path d="M12 2v10M17 7l-5 5" />
                    </svg>
                </div>
                <h1 class="text-3xl font-black text-slate-800">AQUATIC</h1>
                <p class="text-slate-500 text-sm mt-1">智慧監控系統</p>
            </div>

            <h2 class="text-xl font-bold text-slate-700 mb-6 text-center">登入帳號</h2>

            <!-- Error -->
            <div class="error-box mb-4" id="error-msg"></div>

            <!-- Form -->
            <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1.5">帳號</label>
                    <input type="text" id="username" class="input-field" placeholder="請輸入帳號" autocomplete="username"
                        required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1.5">密碼</label>
                    <input type="password" id="password" class="input-field" placeholder="請輸入密碼"
                        autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-primary mt-2" id="login-btn">登入</button>
            </form>

            <!-- Register link -->
            <p class="text-center text-sm text-slate-500 mt-6">
                還沒有帳號？
                <a href="/register" class="text-blue-600 font-semibold hover:underline">立即註冊</a>
            </p>

        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errorBox = document.getElementById('error-msg');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerText = '登入中...';
            errorBox.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    window.location.href = '/';
                } else {
                    errorBox.innerText = data.error || '登入失敗';
                    errorBox.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = '登入';
                }
            } catch (err) {
                errorBox.innerText = '網路錯誤，請稍後再試';
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.innerText = '登入';
            }
        }
    </script>
</body>

</html>
